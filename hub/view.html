<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>99names · The Passage</title>
<link rel="icon" href="/hub/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght,SOFT@0,9..144,300..600,0..100;1,9..144,300..600,0..100&family=DM+Sans:opsz,wght@9..40,300..500&family=Scheherazade+New:wght@400;600&display=swap">
<style>
/* 99names · Noor · The Passage. The world's margin and bar, held around one work at a time. */
:root{--sand:#F4EEE4;--paper:#FBF8F2;--ink:#2A2622;--ink2:#5A534B;--mute:rgba(42,38,34,.46);--faint:rgba(42,38,34,.3);--line:rgba(42,38,34,.11);--line2:rgba(42,38,34,.2);--sun:#E8A64B;
  --rose:#F6DCCF;--dawn:#EFD9B8;--sage:#CFD9C4;--skyb:#C9DBE6;--disp:'Fraunces',Georgia,serif;--sans:'DM Sans',system-ui,sans-serif;--ar:'Scheherazade New',serif;--ease:cubic-bezier(.16,1,.3,1);--col:272px;--bar:60px}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--sand);color:var(--ink);font-family:var(--sans);font-weight:300;-webkit-font-smoothing:antialiased;overflow:hidden;font-size:15px}
a{color:inherit;text-decoration:none}button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}svg{display:block}
.world{display:grid;grid-template-columns:var(--col) minmax(0,1fr);grid-template-rows:var(--bar) minmax(0,1fr);height:100vh;height:100svh}
.margin{grid-row:1/3;position:relative;display:flex;flex-direction:column;padding:26px 22px 22px 26px;min-height:0;overflow:hidden;background:linear-gradient(180deg,rgba(255,255,255,.55),rgba(255,255,255,0) 60%),var(--sand)}
.margin::after{content:"";position:absolute;top:0;bottom:0;right:0;width:1px;background:linear-gradient(180deg,transparent,var(--line2) 12%,var(--line2) 88%,transparent)}
.mk{display:flex;align-items:center;gap:14px;padding:4px 4px 22px;flex:none;border-bottom:1px solid var(--line)}
.mk .ring{width:44px;height:44px;flex:none;color:var(--ink)}
.mk .ring svg{width:100%;height:100%;overflow:visible;animation:breathe 9s ease-in-out infinite}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.05) rotate(1.5deg)}}
.mk .n{font-family:var(--disp);font-weight:300;font-size:20px;line-height:1.05;font-variation-settings:"opsz" 144,"SOFT" 100}.mk .n em{font-weight:400}
.mk .s{font-size:10.5px;letter-spacing:.26em;text-transform:uppercase;color:var(--mute);margin-top:4px}
.index{margin-top:12px;flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:thin;scrollbar-color:var(--line2) transparent}
.index .rm{border-bottom:1px solid var(--line)}.index .rm:last-child{border-bottom:0}
.index .rm>a{display:grid;grid-template-columns:30px 1fr;align-items:baseline;gap:8px;padding:11px 6px;border-radius:12px;position:relative;transition:background .3s}
.index .rm>a .n{font-family:var(--disp);font-style:italic;font-size:15px;color:var(--faint)}
.index .rm>a .t{font-size:14.5px;font-weight:400}
.index .rm>a:hover{background:rgba(255,255,255,.55)}
.index .rm.here>a{background:rgba(255,255,255,.7)}.index .rm.here>a .n{color:var(--sun)}
.index .rm.here>a::before{content:"";position:absolute;left:-18px;top:18px;width:7px;height:7px;border-radius:50%;background:var(--sun);box-shadow:0 0 0 5px rgba(232,166,75,.18),0 0 18px rgba(232,166,75,.55)}
.index .works{list-style:none;display:none;padding:2px 0 12px 36px}
.index .rm.here .works{display:block}
.index .works a{display:block;padding:6px 10px;font-size:13px;line-height:1.35;color:var(--mute);border-left:1px solid var(--line);transition:color .28s,border-color .28s}
.index .works a:hover{color:var(--ink);border-color:var(--line2)}
.index .works a.on{color:var(--ink);border-color:var(--sun)}
.index .loading{padding:14px 8px;font-size:10.5px;letter-spacing:.24em;text-transform:uppercase;color:var(--faint)}
.m-foot{margin-top:auto;padding-top:14px;display:grid;gap:8px;flex:none}
.m-foot a{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 16px;border-radius:999px;border:1px solid var(--line2);font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--ink2);transition:border-color .35s,color .35s,background .35s}
.m-foot a:hover{border-color:var(--ink);color:var(--ink);background:rgba(255,255,255,.6)}
.m-foot .home{background:var(--ink);color:var(--sand);border-color:var(--ink)}.m-foot .home:hover{background:var(--ink);color:var(--sand)}
.m-foot .credit{padding:8px 4px 0;font-size:10.5px;letter-spacing:.22em;text-transform:uppercase;color:var(--faint)}
.m-foot .credit .ar{font-family:var(--ar);font-size:16px;letter-spacing:0;text-transform:none;color:var(--mute);margin-right:8px}
.bar{display:flex;align-items:center;justify-content:space-between;gap:18px;padding:0 16px 0 20px;border-bottom:1px solid var(--line);background:rgba(244,238,228,.86);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);min-width:0}
.bar .back{display:flex;align-items:center;gap:9px;padding:8px 12px;border-radius:999px;color:var(--ink2);font-size:11px;letter-spacing:.2em;text-transform:uppercase;transition:color .3s,background .3s;flex:none}
.bar .back:hover{color:var(--ink);background:rgba(255,255,255,.6)}.bar .back i{font-style:normal;color:var(--sun);font-size:14px}
.bar .crumbs{display:flex;align-items:center;gap:12px;min-width:0;flex:1;overflow:hidden;font-size:12px;letter-spacing:.06em;color:var(--mute)}
.bar .crumbs .sl{color:var(--faint);flex:none}.bar .crumbs .rm{font-family:var(--disp);font-style:italic;font-size:15px;letter-spacing:0;color:var(--ink);flex:none;white-space:nowrap}
.bar .crumbs .pg{color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.bar .tools{display:flex;align-items:center;gap:6px;flex:none}
.bar .tools a,.bar .tools button{display:flex;align-items:center;gap:8px;padding:8px 13px;border-radius:999px;border:1px solid transparent;color:var(--ink2);font-size:11px;letter-spacing:.2em;text-transform:uppercase;transition:color .28s,border-color .28s,background .28s}
.bar .tools a:hover,.bar .tools button:hover{color:var(--ink);border-color:var(--line2);background:rgba(255,255,255,.6)}
.bar .tools svg{width:15px;height:14px}
.stage{position:relative;min-width:0;min-height:0;background:var(--paper);margin:12px 12px 12px 0;border-radius:22px;overflow:hidden;box-shadow:0 20px 50px -30px rgba(42,38,34,.3);border:1px solid var(--line)}
.stage iframe{width:100%;height:100%;border:0;display:block;background:var(--paper);opacity:0;transition:opacity .6s var(--ease)}
.stage.ready iframe{opacity:1}
.stage .wait{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;font-family:var(--disp);font-style:italic;font-size:18px;color:var(--mute);opacity:1;transition:opacity .4s;background:linear-gradient(160deg,var(--rose),var(--dawn) 45%,var(--sage))}
.stage.ready .wait{opacity:0}
.stage .miss{position:absolute;inset:0;display:none;place-items:center;text-align:center;padding:40px}
.stage.empty .miss{display:grid}.stage.empty iframe,.stage.empty .wait{display:none}
.miss h2{font-family:var(--disp);font-weight:300;font-size:34px;margin-bottom:12px}.miss p{color:var(--ink2);max-width:44ch;margin:0 auto 22px}
.miss a{display:inline-flex;padding:11px 18px;border-radius:999px;background:var(--ink);color:var(--sand);font-size:11px;letter-spacing:.22em;text-transform:uppercase}
body.wide .world{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr)}
body.wide .stage{grid-column:1;grid-row:1;margin:0;border-radius:0;border:0}
body.wide .margin,body.wide .bar{display:none}
.restore{position:fixed;left:18px;bottom:18px;z-index:40;display:none;align-items:stretch;font-size:11px;letter-spacing:.2em;text-transform:uppercase;background:rgba(244,238,228,.92);backdrop-filter:blur(12px);border:1px solid var(--line2);border-radius:999px;box-shadow:0 14px 40px -20px rgba(42,38,34,.4);overflow:hidden}
body.wide .restore{display:flex}
.restore button,.restore a{display:flex;align-items:center;gap:9px;padding:10px 15px;color:var(--ink2);transition:color .28s,background .28s}
.restore button:hover,.restore a:hover{color:var(--ink);background:rgba(255,255,255,.7)}
.restore .sep{width:1px;background:var(--line);flex:none}.restore svg{width:15px;height:14px;color:var(--sun)}
.restore kbd{font:inherit;font-size:10px;padding:2px 6px;border-radius:6px;border:1px solid var(--line2);color:var(--mute)}
@media (max-width:980px){.world{grid-template-columns:minmax(0,1fr)}.margin{display:none}.bar{grid-column:1;padding:0 10px}.stage{grid-column:1;margin:0;border-radius:0;border:0}.bar .crumbs .rm,.bar .crumbs .sl{display:none}.bar .tools .lbl{display:none}.bar .back span{display:none}}
@media print{body{overflow:visible}.margin,.bar,.restore{display:none!important}.world{display:block;height:auto}.stage{position:static;margin:0;border:0}.stage iframe{width:100%;height:auto;min-height:100vh;opacity:1}.stage .wait,.stage .miss{display:none!important}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<div class="world">
  <aside class="margin">
    <a class="mk" href="/" title="Back to the World"><span class="ring" id="ring"></span><span><span class="n">99<em>names</em></span><div class="s">The world of Noor</div></span></a>
    <nav class="index" id="index"><div class="loading">Reading the world</div></nav>
    <div class="m-foot">
      <a class="home" href="/"><span>Back to the World</span><span>&larr;</span></a>
      <a href="/leave"><span>Leave the world</span><span>&rarr;</span></a>
      <div class="credit"><span class="ar">نور</span>99names &middot; 2026</div>
    </div>
  </aside>
  <header class="bar">
    <a class="back" href="/" title="Back to the World"><i>&larr;</i><span>The World</span></a>
    <div class="crumbs"><span class="sl">/</span><span class="rm" id="crumb-room">Noor</span><span class="sl">/</span><span class="pg" id="crumb-page">&nbsp;</span></div>
    <div class="tools">
      <a id="raw" href="/" target="_blank" rel="noopener" title="Open this page on its own, in a new tab"><svg viewBox="0 0 16 14" fill="none" stroke="currentColor" stroke-width="1.3"><path d="M6 2.6H2v9.4h9.4V8"/><path d="M9.4 2.6H14v4.6"/><path d="M14 2.6 7.6 9"/></svg><span class="lbl">On its own</span></a>
      <button type="button" id="expand" title="Expand the page to the full window (E)"><svg viewBox="0 0 16 14" fill="none" stroke="currentColor" stroke-width="1.3"><path d="M6.2 2.4H2v4.2M9.8 11.6H14V7.4"/><path d="M2 2.4 6.6 7M14 11.6 9.4 7"/></svg><span class="lbl">Expand</span></button>
    </div>
  </header>
  <main class="stage" id="stage">
    <div class="wait">Opening</div>
    <iframe id="frame" name="nn-passage" title="The work" src="about:blank"></iframe>
    <div class="miss"><div><h2>Nothing is held here.</h2><p>The Passage shows one work at a time, and none was named. Everything in the world is one step back.</p><a href="/">Back to the World</a></div></div>
  </main>
</div>
<div class="restore" id="restore">
  <button type="button" id="shrink" title="Bring the world back (Esc)"><svg viewBox="0 0 16 14" fill="none" stroke="currentColor" stroke-width="1.3"><rect x="1.4" y="1.8" width="13.2" height="10.4" rx="2"/><path d="M6.2 1.8v10.4"/></svg><span>The World</span><kbd>Esc</kbd></button>
  <i class="sep"></i><a href="/" title="Back to the World">&larr;</a>
</div>
<script>
(function(){var NS='http://www.w3.org/2000/svg',svg=document.createElementNS(NS,'svg');svg.setAttribute('viewBox','0 0 100 100');
for(var k=0;k<99;k++){var a=-Math.PI/2+k/99*Math.PI*2,lg=k%11===0,r1=27,r2=lg?46:40,l=document.createElementNS(NS,'line');l.setAttribute('x1',50+Math.cos(a)*r1);l.setAttribute('y1',50+Math.sin(a)*r1);l.setAttribute('x2',50+Math.cos(a)*r2);l.setAttribute('y2',50+Math.sin(a)*r2);l.setAttribute('stroke','currentColor');l.setAttribute('stroke-width',lg?'1.1':'.8');l.setAttribute('stroke-linecap','round');svg.appendChild(l)}
var t=document.createElementNS(NS,'text');t.setAttribute('x','50');t.setAttribute('y','55.5');t.setAttribute('text-anchor','middle');t.setAttribute('font-family','Fraunces,Georgia,serif');t.setAttribute('font-size','17');t.setAttribute('font-weight','300');t.setAttribute('fill','currentColor');t.textContent='99';svg.appendChild(t);document.getElementById('ring').appendChild(svg)})();
</script>
<script src="/hub/view.js" defer></script>
</body></html>
