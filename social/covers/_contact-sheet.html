<!doctype html><html><head><meta charset="utf-8"><title>covers · contact sheet</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&display=swap">
<style>
*{box-sizing:border-box;margin:0;padding:0}body{font-family:'DM Sans',system-ui,sans-serif;background:#fff;color:#262626;padding:40px}
.mock{display:grid;grid-template-columns:1fr 1fr;gap:40px}
.ph{border-radius:28px;padding:28px 18px;width:100%}
.ph.light{background:#fff;border:1px solid #dbdbdb}.ph.dark{background:#000;color:#fafafa;border:1px solid #262626}
.head{display:flex;align-items:center;gap:26px;margin-bottom:22px}
.pp{width:86px;height:86px;border-radius:50%;object-fit:cover;flex:none}
.user{font-weight:600;font-size:16px}.bio{font-size:13px;line-height:1.4;margin-top:4px}
.row{display:flex;gap:16px;overflow:hidden;padding:4px 0}
.hl{display:flex;flex-direction:column;align-items:center;gap:6px;flex:none;width:72px}
.hl img{width:64px;height:64px;border-radius:50%;object-fit:cover;outline:1.5px solid #dbdbdb;outline-offset:3px}
.dark .hl img{outline-color:#363636}
.hl span{font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:72px}
.big{display:grid;grid-template-columns:repeat(7,1fr);gap:22px;margin-top:40px}
.big div{text-align:center;font-size:12px;color:#555}.big img{width:100%;border-radius:50%;display:block;margin-bottom:8px}
h2{font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:#888;margin:34px 0 12px}
</style></head><body>
<div class="mock" id="mock"></div>
<h2>at 160px</h2><div class="big" id="big"></div>
<script>
const H=[["profile-picture","99names"],["highlight-start-here","Start here"],["highlight-names","Names"],["highlight-hours","Hours"],["highlight-deck","The Deck"],["highlight-send","Send"],["highlight-shop","Shop"],["highlight-app","App"],["highlight-remember","Remember"],["highlight-breathe","Breathe"],["highlight-jumuah","Jumu'ah"],["highlight-readers","Readers"],["highlight-ramadan","Ramadan"]];
const row=(a,b)=>`<div class="row">${H.slice(a,b).filter(x=>!x[0].startsWith("profile")).map(([f,t])=>`<div class="hl"><img src="${f}.png"><span>${t}</span></div>`).join("")}</div>`;
const ph=(cls,pp)=>`<div class="ph ${cls}"><div class="head"><img class="pp" src="${pp}.png"><div><div class="user">official99names</div><div class="bio">99names<br>Light, by name. One of the 99, one a week.<br>99names.net</div></div></div>${row(0,7)}${row(7,13)}</div>`;
document.getElementById("mock").innerHTML=ph("light","profile-picture")+ph("dark","profile-picture-night");
document.getElementById("big").innerHTML=H.map(([f,t])=>`<div><img src="${f}.png">${t}</div>`).join("")+`<div><img src="profile-picture-night.png">99names · night</div>`;
</script></body></html>
