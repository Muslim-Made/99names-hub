<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>99names · The Threshold</title>
<link rel="icon" href="/hub/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght,SOFT@0,9..144,300..600,0..100;1,9..144,300..600,0..100&family=DM+Sans:opsz,wght@9..40,300..500&family=Scheherazade+New:wght@400;600&display=swap">
<style>
/* 99names · Noor · The Threshold
   The sky is tinted to the hour. A horizon. Ninety-nine rays rise out of it,
   one at a time, and settle into the mark. Give the name and the key and the
   light floods through. Served open by middleware.js; on a plain local server
   the page opens anyway so the entrance can be rehearsed. */
:root{--sand:#F4EEE4;--ink:#2A2622;--ink2:#5A534B;--sun:#E8A64B;--night:#171A26;
  --g1:#F6DCCF;--g2:#EFD9B8;--g3:#CFD9C4;--g4:#C9DBE6;--fg:var(--ink);--fg2:rgba(42,38,34,.66);--mute:rgba(42,38,34,.42);--line:rgba(42,38,34,.16);--surface:rgba(255,255,255,.34);--flood:#FFF8EE;
  --disp:'Fraunces',Georgia,serif;--sans:'DM Sans',system-ui,sans-serif;--ar:'Scheherazade New',serif;--ease:cubic-bezier(.16,1,.3,1)}
html[data-hour="morning"]{--g1:#F4EEE4;--g2:#F3E3C2;--g3:#F1D9A6;--g4:#EFD9B8}
html[data-hour="dhuhr"]{--g1:#F4EEE4;--g2:#EFD9B8;--g3:#F6DCCF;--g4:#F2CFC0}
html[data-hour="asr"]{--g1:#EFD9B8;--g2:#DCDCBE;--g3:#CFD9C4;--g4:#A9BFA6}
html[data-hour="maghrib"]{--g1:#E8A64B;--g2:#D98C7C;--g3:#6B5A7A;--g4:#2A2F44;--fg:var(--sand);--fg2:rgba(244,238,228,.78);--mute:rgba(244,238,228,.5);--line:rgba(244,238,228,.22);--surface:rgba(255,255,255,.1);--flood:#F6DCCF}
html[data-hour="isha"]{--g1:#2A2F44;--g2:#1F2334;--g3:#171A26;--g4:#171A26;--fg:var(--sand);--fg2:rgba(244,238,228,.76);--mute:rgba(244,238,228,.46);--line:rgba(244,238,228,.18);--surface:rgba(255,255,255,.07);--flood:#EFD9B8}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--sans);font-weight:300;color:var(--fg);-webkit-font-smoothing:antialiased;overflow:hidden;
  background:linear-gradient(180deg,var(--g1) 0%,var(--g2) 38%,var(--g3) 68%,var(--g4) 100%);transition:background 1.6s var(--ease)}
.sky{position:fixed;inset:0}
.sky canvas{position:absolute;inset:0;width:100%;height:100%}
.sky .haze{position:absolute;inset:0;background:radial-gradient(60% 50% at 50% 62%,rgba(255,255,255,.28),transparent 70%)}
html[data-hour="isha"] .sky .haze,html[data-hour="maghrib"] .sky .haze{background:radial-gradient(60% 50% at 50% 62%,rgba(232,166,75,.16),transparent 70%)}
.horizon{position:fixed;left:0;right:0;top:62%;height:1px;background:linear-gradient(90deg,transparent,var(--line) 20%,var(--line) 80%,transparent);transform:scaleX(0);animation:hz 2.2s var(--ease) .2s forwards}
@keyframes hz{to{transform:none}}

.stage{position:relative;height:100%;display:grid;grid-template-rows:1fr auto 1fr;justify-items:center;padding:0 24px}
.above{align-self:end;display:grid;justify-items:center;gap:6px;padding-bottom:10px}
.above .ar{font-family:var(--ar);font-size:38px;line-height:1;color:var(--fg2);opacity:0;animation:up 1.6s var(--ease) 1.1s forwards}
.above .kick{font-size:11px;letter-spacing:.32em;text-transform:uppercase;color:var(--mute);opacity:0;animation:up 1.6s var(--ease) 1.4s forwards}
@keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

.mark{position:relative;width:min(46vh,300px);height:min(46vh,300px);animation:rise 2.6s var(--ease) .1s both}
@keyframes rise{from{transform:translateY(24%) scale(.94);opacity:0}to{transform:none;opacity:1}}
.mark svg{width:100%;height:100%;overflow:visible}
.mark .ray{stroke:var(--fg);stroke-width:1.1;stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:1;opacity:.82}
.mark .ray.long{opacity:1}
.mark .ring{fill:none;stroke:var(--fg);stroke-width:1;opacity:0;animation:fade 1.4s var(--ease) 2.2s forwards}
.mark .num{font-family:var(--disp);font-weight:300;font-size:64px;fill:var(--fg);font-variation-settings:"opsz" 144,"SOFT" 100;opacity:0;animation:fade 1.4s var(--ease) 2.5s forwards}
@keyframes fade{to{opacity:1}}
.mark .glow{position:absolute;inset:-30%;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.55),transparent 60%);opacity:0;animation:breath 7s ease-in-out 3s infinite}
html[data-hour="isha"] .mark .glow,html[data-hour="maghrib"] .mark .glow{background:radial-gradient(circle,rgba(232,166,75,.32),transparent 60%)}
@keyframes breath{0%,100%{opacity:.35;transform:scale(.96)}50%{opacity:.7;transform:scale(1.04)}}

.below{align-self:start;display:grid;justify-items:center;gap:22px;padding-top:22px;width:100%;max-width:340px}
.wordmark{font-family:var(--disp);font-weight:300;font-size:34px;letter-spacing:-.02em;font-variation-settings:"opsz" 144,"SOFT" 100;line-height:1;opacity:0;animation:up 1.6s var(--ease) 2.6s forwards}
.wordmark em{font-style:italic;font-weight:400}
.line{font-size:13px;color:var(--fg2);margin-top:-14px;opacity:0;animation:up 1.6s var(--ease) 2.8s forwards}
form{width:100%;display:grid;gap:10px;opacity:0;animation:up 1.6s var(--ease) 3s forwards}
.field{position:relative}
.field input{width:100%;height:46px;padding:0 18px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--fg);font:inherit;font-size:14px;font-weight:300;letter-spacing:.01em;outline:0;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);transition:border-color .4s,background .4s,box-shadow .4s}
.field input::placeholder{color:var(--mute)}
.field input:focus{border-color:var(--fg2);background:rgba(255,255,255,.5);box-shadow:0 0 0 6px rgba(255,255,255,.14)}
html[data-hour="isha"] .field input:focus,html[data-hour="maghrib"] .field input:focus{background:rgba(255,255,255,.13);box-shadow:0 0 0 6px rgba(232,166,75,.12)}
button{height:46px;border-radius:999px;border:0;background:var(--fg);color:var(--g1);font:inherit;font-size:12px;letter-spacing:.28em;text-transform:uppercase;cursor:pointer;transition:transform .5s var(--ease),box-shadow .5s,opacity .3s;display:flex;align-items:center;justify-content:center;gap:10px}
html[data-hour="isha"] button,html[data-hour="maghrib"] button{background:var(--sand);color:var(--night)}
button:hover{transform:translateY(-1px);box-shadow:0 14px 30px -14px rgba(42,38,34,.5)}
button.busy{opacity:.7;pointer-events:none}
button i{width:6px;height:6px;border-radius:50%;background:var(--sun);display:inline-block;animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.5;transform:scale(.8)}50%{opacity:1;transform:scale(1.15)}}
.msg{min-height:18px;font-size:12.5px;color:var(--fg2);text-align:center;opacity:0;transition:opacity .4s}
.msg.on{opacity:1}
.foot{position:fixed;left:0;right:0;bottom:22px;display:flex;justify-content:center;gap:22px;font-size:10.5px;letter-spacing:.28em;text-transform:uppercase;color:var(--mute);opacity:0;animation:fade 1.6s var(--ease) 3.4s forwards}
.foot b{font-weight:400;color:var(--fg2)}

/* the wrong key: the light dims and the mark sways */
body.shut .mark{animation:sway .7s var(--ease)}
@keyframes sway{0%,100%{transform:none}25%{transform:translateX(-7px)}60%{transform:translateX(5px)}}
body.shut .mark .ray{opacity:.3;transition:opacity .2s}
body.shut .mark .glow{animation-play-state:paused;opacity:0}

/* the right key: the light floods out from the mark */
.flood{position:fixed;left:50%;top:50%;width:20px;height:20px;margin:-10px 0 0 -10px;border-radius:50%;background:radial-gradient(circle,#fff,var(--flood) 55%,var(--g1) 100%);transform:scale(0);opacity:0;pointer-events:none;z-index:9}
body.open .flood{animation:flood 2.2s cubic-bezier(.7,0,.2,1) forwards}
@keyframes flood{0%{transform:scale(0);opacity:0}20%{opacity:1}100%{transform:scale(220);opacity:1}}
body.open .mark{animation:none;transition:transform 2s cubic-bezier(.7,0,.2,1),opacity 1.2s;transform:scale(1.6);opacity:0}
body.open .mark .ray{transition:opacity .8s;opacity:1}
body.open .above,body.open .below,body.open .foot,body.open .horizon{transition:opacity .9s;opacity:0}
@media (max-height:640px){.above .ar{font-size:28px}.mark{width:min(38vh,220px);height:min(38vh,220px)}.below{gap:14px}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-delay:0s!important;transition-duration:.01ms!important}.mark .ray{stroke-dashoffset:0}}
</style>
</head>
<body>
<div class="sky"><canvas id="motes" aria-hidden="true"></canvas><div class="haze"></div></div>
<div class="horizon" aria-hidden="true"></div>

<main class="stage">
  <div class="above"><div class="ar" aria-hidden="true">نور</div><div class="kick">The world of Noor</div></div>
  <div class="mark" id="mark"><div class="glow"></div>
    <svg viewBox="0 0 400 400" aria-label="99names mark, ninety-nine rays"><g id="rays"></g><circle class="ring" cx="200" cy="200" r="86"/><text class="num" x="200" y="222" text-anchor="middle">99</text></svg>
  </div>
  <div class="below">
    <div class="wordmark">99<em>names</em></div>
    <div class="line">Light, by name.</div>
    <form id="form" method="post" action="/gate" autocomplete="off" novalidate>
      <input type="hidden" name="next" id="next" value="/">
      <div class="field"><input id="user" name="user" type="text" placeholder="Your name" autocapitalize="off" spellcheck="false" aria-label="Name"></div>
      <div class="field"><input id="pass" name="pass" type="password" placeholder="The key" aria-label="Key"></div>
      <button type="submit" id="enter"><i></i><span>Enter</span></button>
      <div class="msg" id="msg" aria-live="polite"></div>
    </form>
  </div>
</main>
<div class="foot"><span id="hourname">Fajr</span><span><b id="time">--:--</b></span><span>99names · 2026</span></div>
<div class="flood" aria-hidden="true"></div>

<script>
(function(){
  var reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  // the hour tints the sky (the same bands the site and the kit use)
  var BANDS=[[4,7,'fajr','Fajr'],[7,11,'morning','Morning'],[11,15,'dhuhr','Dhuhr'],[15,18,'asr','Asr'],[18,20,'maghrib','Maghrib'],[20,28,'isha','Isha']];
  function band(){var h=new Date().getHours();if(h<4)h+=24;for(var i=0;i<BANDS.length;i++)if(h>=BANDS[i][0]&&h<BANDS[i][1])return BANDS[i];return BANDS[0]}
  var hour=null;try{hour=localStorage.getItem('nn-hour')}catch(e){}
  var b=band();for(var i=0;i<BANDS.length;i++)if(BANDS[i][2]===hour)b=BANDS[i];
  document.documentElement.setAttribute('data-hour',b[2]);
  document.getElementById('hourname').textContent=b[3];
  function tick(){var d=new Date();document.getElementById('time').textContent=String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')}
  tick();setInterval(tick,15000);

  // ninety-nine rays, drawn one at a time out of the horizon
  var g=document.getElementById('rays'),NS='http://www.w3.org/2000/svg';
  for(var k=0;k<99;k++){
    var a=-Math.PI/2+k/99*Math.PI*2,long=k%11===0,r1=104,r2=long?176:154;
    var l=document.createElementNS(NS,'line');
    l.setAttribute('x1',200+Math.cos(a)*r1);l.setAttribute('y1',200+Math.sin(a)*r1);
    l.setAttribute('x2',200+Math.cos(a)*r2);l.setAttribute('y2',200+Math.sin(a)*r2);
    l.setAttribute('class','ray'+(long?' long':''));l.setAttribute('pathLength','1');
    // rays nearest the bottom of the ring rise first, like a sun
    var order=(k+50)%99;var fromBottom=Math.min(order,99-order);
    l.style.transition='stroke-dashoffset 1.1s cubic-bezier(.16,1,.3,1) '+(0.5+fromBottom*0.032)+'s';
    g.appendChild(l);
  }
  requestAnimationFrame(function(){requestAnimationFrame(function(){for(var i=0;i<g.children.length;i++)g.children[i].style.strokeDashoffset='0'})});

  // where to go afterwards
  var params=new URLSearchParams(location.search);
  function safe(v){if(!v||v.charAt(0)!=='/'||v.indexOf('//')===0||v.indexOf('/gate')===0||v.indexOf('/leave')===0)return '/';return v}
  var next=safe(params.get('next'));document.getElementById('next').value=next;
  var form=document.getElementById('form'),user=document.getElementById('user'),pass=document.getElementById('pass'),btn=document.getElementById('enter'),msg=document.getElementById('msg'),busy=false;
  var local=/^(localhost|127\.0\.0\.1|0\.0\.0\.0)$/.test(location.hostname);
  function shut(why){
    busy=false;btn.classList.remove('busy');
    msg.textContent=why||'That key does not open here. Try again, gently.';msg.classList.add('on');
    document.body.classList.remove('shut');void document.body.offsetWidth;document.body.classList.add('shut');
    pass.value='';pass.focus();setTimeout(function(){document.body.classList.remove('shut')},900);
  }
  function open(to){
    try{sessionStorage.setItem('nn-entered','1')}catch(e){}
    msg.classList.remove('on');document.body.classList.add('open');
    if(window.__gather)window.__gather();
    setTimeout(function(){location.href=to},reduce?200:2100);
  }
  if(params.get('denied'))setTimeout(function(){shut()},3200);
  form.addEventListener('submit',function(e){
    e.preventDefault();if(busy)return;
    if(!user.value.trim()||!pass.value){shut(!user.value.trim()?'Give your name first.':'The key is missing.');return}
    busy=true;btn.classList.add('busy');
    fetch('/gate',{method:'POST',headers:{'content-type':'application/json','accept':'application/json','x-requested-with':'fetch'},body:JSON.stringify({user:user.value,pass:pass.value,next:next})})
      .then(function(r){
        if(r.status===401){shut();return}
        if(r.ok){return r.json().then(function(j){open(safe(j.next)||next)})}
        if(local){open(next);return}   // no middleware behind this page: rehearse the entrance
        busy=false;form.submit();
      })
      .catch(function(){if(local){open(next)}else{busy=false;form.submit()}});
  });
  setTimeout(function(){if(!document.body.classList.contains('open'))user.focus({preventScroll:true})},reduce?100:3200);

  // the motes: ninety-nine points of light drifting up through the sky
  if(reduce)return;
  var cv=document.getElementById('motes'),x=cv.getContext('2d'),DPR=Math.min(2,devicePixelRatio||1),W,H,P=[],gather=false,t0=performance.now();
  var dark=/isha|maghrib/.test(b[2]);
  function size(){W=cv.width=innerWidth*DPR;H=cv.height=innerHeight*DPR}
  size();addEventListener('resize',size);
  for(var i=0;i<99;i++)P.push({x:Math.random(),y:Math.random(),r:1+Math.random()*1.8,v:0.00012+Math.random()*0.00025,s:Math.random()*6.28,w:0.2+Math.random()*0.5});
  window.__gather=function(){gather=true};
  (function frame(now){
    requestAnimationFrame(frame);var t=(now-t0)/1000;
    x.clearRect(0,0,W,H);
    for(var i=0;i<P.length;i++){
      var p=P[i];p.y-=p.v;if(p.y<-0.02){p.y=1.02;p.x=Math.random()}
      var px=p.x*W+Math.sin(t*p.w+p.s)*14*DPR,py=p.y*H;
      if(gather){px+=(W/2-px)*0.06;py+=(H/2-py)*0.06;p.x=px/W;p.y=py/H}
      var a=0.25+0.45*(0.5+0.5*Math.sin(t*1.3+p.s));
      x.beginPath();x.arc(px,py,p.r*DPR,0,6.283);
      x.fillStyle=dark?'rgba(244,238,228,'+a+')':'rgba(255,255,255,'+(a+0.2)+')';x.fill();
    }
  })(t0);
})();
</script>
</body></html>
